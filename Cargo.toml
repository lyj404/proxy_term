[package]
name = "proxy_term"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
slint = { version = "1.16", default-features = false, features = ["backend-winit", "renderer-femtovg", "std", "compat-1-2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls", "socks-proxy"] }
tray-icon = "0.24"
image = { version = "0.25", default-features = false, features = ["ico"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
opt-level = "z"

[[bin]]
name = "proxy-term"
path = "src/main.rs"

[build-dependencies]
slint-build = "1.16"
winres = "0.1"
