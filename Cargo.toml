[package]
name = "proxy_term"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
slint = { version = "1.16", default-features = false, features = ["backend-winit", "renderer-femtovg", "std", "compat-1-2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
slint-build = "1.16"
winres = "0.1"
